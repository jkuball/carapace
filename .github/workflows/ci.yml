name: CI

on:
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"
      - run: uv sync --dev
      - run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"
      - run: uv sync --dev
      - run: uv run pytest

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
      - run: helm lint charts/carapace

  docker-backend:
    runs-on: ubuntu-latest
    needs: [backend-lint, test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:pr${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    runs-on: ubuntu-latest
    needs: [backend-lint, test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:pr${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-sandbox:
    runs-on: ubuntu-latest
    needs: [backend-lint, test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: sandbox
          push: true
          tags: ghcr.io/${{ github.repository }}-sandbox:pr${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-bitwarden-cli:
    runs-on: ubuntu-latest
    needs: [backend-lint, test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: bitwarden-cli
          push: true
          tags: ghcr.io/${{ github.repository }}-bitwarden-cli:pr${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-publish-pr:
    runs-on: ubuntu-latest
    needs:
      [
        helm-lint,
        docker-backend,
        docker-frontend,
        docker-sandbox,
        docker-bitwarden-cli,
      ]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
      - name: Package PR Helm chart
        id: package
        run: |
          base_version=$(awk '/^version:/ { print $2; exit }' charts/carapace/Chart.yaml)
          pr_number='${{ github.event.pull_request.number }}'
          chart_version="${base_version}-pr.${pr_number}"
          app_version="pr${pr_number}"

          mkdir -p dist
          helm package charts/carapace \
            --destination dist \
            --version "$chart_version" \
            --app-version "$app_version"

          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push PR Helm chart to GHCR
        run: |
          helm push \
            "dist/carapace-${{ steps.package.outputs.chart_version }}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Upload PR Helm chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carapace-chart-pr${{ github.event.pull_request.number }}
          path: dist/carapace-${{ steps.package.outputs.chart_version }}.tgz

      - name: Print PR preview tags
        run: |
          echo "::notice title=PR preview image tag::${{ steps.package.outputs.app_version }}"
          echo "::notice title=PR preview chart version::${{ steps.package.outputs.chart_version }}"
          echo "Use image tag: ${{ steps.package.outputs.app_version }}"
          echo "Use chart version: ${{ steps.package.outputs.chart_version }}"

          {
            echo "## PR preview artifacts"
            echo
            echo "Use image tag: ${{ steps.package.outputs.app_version }}"
            echo "Use chart version: ${{ steps.package.outputs.chart_version }}"
            echo
            echo "Images:"
            echo "- ghcr.io/${{ github.repository }}:${{ steps.package.outputs.app_version }}"
            echo "- ghcr.io/${{ github.repository }}-frontend:${{ steps.package.outputs.app_version }}"
            echo "- ghcr.io/${{ github.repository }}-sandbox:${{ steps.package.outputs.app_version }}"
            echo "- ghcr.io/${{ github.repository }}-bitwarden-cli:${{ steps.package.outputs.app_version }}"
            echo
            echo "Chart:"
            echo "- oci://ghcr.io/${{ github.repository_owner }}/charts/carapace --version ${{ steps.package.outputs.chart_version }}"
          } >> "$GITHUB_STEP_SUMMARY"
