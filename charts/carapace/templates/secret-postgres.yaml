{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
{{- $name := printf "%s-postgres" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.postgres.auth.password }}
{{- if not $password }}
  {{- if and $existing $existing.data (index $existing.data .Values.postgres.auth.passwordKey) }}
    {{- $password = index $existing.data .Values.postgres.auth.passwordKey | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 24 }}
  {{- end }}
{{- end }}
{{- $url := printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.auth.username $password .Release.Name .Values.postgres.auth.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "carapace.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  {{ .Values.postgres.auth.passwordKey }}: {{ $password | b64enc | quote }}
  {{ .Values.postgres.auth.urlKey }}: {{ $url | b64enc | quote }}
{{- end }}
