# -- Container image settings
image:
  registry: ghcr.io
  repository: thiesgerken/carapace
  tag: "" # defaults to appVersion
  pullPolicy: IfNotPresent

frontend:
  enabled: true
  image:
    registry: ghcr.io
    repository: thiesgerken/carapace-frontend
    tag: "" # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- Server ports
server:
  # -- API port (FastAPI / REST + WebSocket)
  apiPort: 8321
  # -- Sandbox-facing API port (Basic Auth, Git HTTP backend)
  sandboxPort: 8322
  # -- Proxy port (sandbox HTTP proxy)
  proxyPort: 3128
  probes:
    startup:
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 20
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10

sandbox:
  image:
    registry: ghcr.io
    repository: thiesgerken/carapace-sandbox
    tag: "" # defaults to appVersion
  # -- PriorityClass override for sandbox pods (empty = use global priorityClassName)
  priorityClassName: ""
  # -- Resource requests/limits for sandbox containers
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- Per-session PVC settings (StatefulSet mode)
  sessionPvc:
    size: 1Gi
    # -- Leave empty to use the cluster default StorageClass
    storageClass: ""
  # -- Preferred Sandboxes CR name for sandbox StatefulSets; set to null for the release default or "" for Deployment fallback
  sandboxesName:

# -- Ingress configuration (Gateway API HTTPRoute)
ingress:
  enabled: true
  hostname: carapace.example.com
  # -- Gateway parent references (required when ingress is enabled)
  parentRefs:
    - name: default-gateway
  # -- Extra annotations on the HTTPRoute
  annotations: {}

# -- Persistence
persistence:
  # Data PVC (config, sessions, knowledge — server-only, no sandbox access needed)
  data:
    # -- Leave empty to use the cluster default StorageClass
    storageClassName: ""
    size: 10Gi
    # -- Finalizers to protect the PVC from accidental deletion (e.g. by ArgoCD pruning)
    finalizers: []
    # - kubernetes.io/pvc-protection

# -- Priority class name for server and frontend pods (sandbox can override via sandbox.priorityClassName)
priorityClassName: ""

# -- Server resource requests/limits
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi

# -- Overwrite existing asset files (SOUL.md, SECURITY.md, bundled skills, …)
# with the versions bundled in the container image on every startup.
resetAssets: false

# -- Standalone Bitwarden CLI proxy instance(s) for Bitwarden-compatible credential backends.
# Each entry spawns a companion Pod running `bw serve` behind an nginx Basic Auth proxy.
# The matching credential backend in config.yaml should use type: bitwarden
# with url set to http://<release>-bitwarden-<name>:<port> or fullnameOverride:<port>.
#
# Example:
#   bitwarden:
#     persistence:
#       enabled: true   # set false for ephemeral Bitwarden CLI data (no PVC)
#       size: 256Mi
#       storageClassName: ""
#     instances:
#       - name: personal
#         fullnameOverride: carapace-bitwarden-personal
#         serverUrl: https://vault.example.com
#         existingSecret: carapace-bw-personal
#         basicAuth:
#           existingSecret: carapace-bitwarden-personal-basic-auth
#         # The Secret is mounted as files under /run/secrets/bitwarden (e.g. BW_MASTER_PASSWORD;
#         # BW_CLIENTID + BW_CLIENTSECRET for API key login, or BW_EMAIL for password-only login).
#         resources:
#           requests:
#             cpu: 50m
#             memory: 128Mi
#           limits:
#             memory: 256Mi
bitwarden:
  image:
    registry: ghcr.io
    repository: thiesgerken/carapace-bitwarden-cli
    tag: "" # defaults to appVersion
    pullPolicy: IfNotPresent
  nginx:
    image:
      registry: docker.io
      repository: library/nginx
      tag: 1.31.1@sha256:5aca99593157f4ae539a5dec1092a0ad8762f8e2eb1789085a13a0f5622369f6
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  # -- One PVC per bitwarden instance; stores CLI device/session data so redeploys do not
  # trigger a fresh login (and provider "new device" emails). Disable for ephemeral instances.
  persistence:
    enabled: true
    size: 256Mi
    storageClassName: ""
    # -- Finalizers to protect Bitwarden CLI data PVCs from accidental deletion.
    finalizers: []
  instances: []

# -- Extra environment variables injected into the server container
# Example:
#   extraEnv:
#     - name: CARAPACE_LOG_LEVEL
#       value: debug
extraEnv: []

# -- Additional envFrom entries (secretRef / configMapRef) for the server container.
# Use this to inject API keys and other secrets from an externally managed Secret.
# Example:
#   envFrom:
#     - secretRef:
#         name: carapace-secrets
#     - configMapRef:
#         name: carapace-env
envFrom: []

redis:
  enabled: true
  image:
    registry: docker.io
    repository: library/redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
